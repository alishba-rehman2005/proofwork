<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ProofWork">
  <!--
    The same mark the header, sidebar and footer draw: a brand-blue tile with
    the brand check on it. The favicon used to be a dark navy gradient with a
    seal, which matched nothing else in the product.

    The colour is stated literally because a favicon is drawn by browser
    chrome, outside the page, where the theme custom properties do not reach.
    It reads on a light and a dark tab strip alike, so the mark stays constant
    either way, which is what a brand mark should do.
  -->
  <rect width="64" height="64" rx="15" fill="#003bfa" />
  <path
    d="M46.7 21.3 26.4 41.6l-9.1-9.1"
    fill="none"
    stroke="#fff"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
